# Daily: benchmark any free model not on the leaderboard yet, commit the results, redeploy the site.
name: Leaderboard

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # Ubuntu 24+ blocks unprivileged user namespaces by default; bubblewrap needs them.
      - name: Install sandbox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Vanilla Pi, pinned so every result on the board comes from the same harness.
      - name: Install Pi
        run: |
          curl -fsSL -o /tmp/pi.tar.gz https://github.com/earendil-works/pi/releases/download/v1.1.0/pi-linux-x64.tar.gz
          echo "3faa94666cd3849d37af320ff749407d0271b07a9b94f420c87e30866e10e289  /tmp/pi.tar.gz" | sha256sum -c
          tar xzf /tmp/pi.tar.gz -C "$HOME"
          echo "PI_DIR=$HOME/pi" >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile

      - name: Benchmark new models
        run: bun run bench
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LEADERBOARD_SEED: ${{ secrets.LEADERBOARD_SEED }}

      # Results are saved after every model, so keep whatever finished even if the run failed.
      - name: Commit results
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git add packages/core/results.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git -c user.name="snakemark-bot" -c user.email="snakemark-bot@users.noreply.github.com" \
            commit -m "Leaderboard: daily results $(date -u +%F)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy site
        if: ${{ !cancelled() && steps.commit.outputs.changed == 'true' }}
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
